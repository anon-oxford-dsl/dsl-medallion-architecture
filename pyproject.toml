[project]
name = "medallion"
version = "0.1.0"
description = "A declarative framework for medallion architecture infrastructure generation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "jinja2==3.1.6",
]

[project.scripts]
medallion = "medallion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.5",
    "duckdb==1.5.5",
]
airflow = [
    "apache-airflow==3.3.1",
]
dbt = [
    "dbt-core==1.12.3",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.5",
]

# Note: Airflow and dbt are kept in separate optional groups so the framework itself
# stays installable without either. They are NOT declared conflicting: at the versions
# pinned here they co-resolve and co-install cleanly, and the whole suite passes in a
# single environment (`uv sync --all-groups`).

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Golden files are generated artefacts compared byte-for-byte; linting them would
# couple the expected output to this project's own style rules.
extend-exclude = ["tests/generation/golden", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unknown markers are an error, so a typo cannot silently disable a deployment test.
addopts = ["--strict-markers"]
markers = [
    "duckdb: exercises a real DuckDB engine (generated DDL must execute)",
    "airflow: exercises Apache Airflow DAG validation (needs the 'airflow' group)",
    "dbt: exercises a real dbt parse/compile (needs the 'dbt' group)",
]
